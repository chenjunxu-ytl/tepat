<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    width: 290px;
    margin: 0;
    padding: 14px;
    color: #1e293b;
    background: #ffffff;
    user-select: none;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 0 3px #dbeafe;
  }
  .title {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.2px;
  }
  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2.5px 7px;
    border-radius: 10px;
  }
  .status-ok { background: #dcfce7; color: #15803d; }
  .status-bad { background: #fee2e2; color: #b91c1c; }

  /* 三大核心功能菜单选项 */
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .menu-btn {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #1e293b;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .menu-btn:hover {
    background: #eff6ff;
    border-color: #bfdbfe;
    transform: translateY(-1.5px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }

  .menu-btn:active {
    transform: scale(0.98);
  }

  .menu-btn-disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .menu-btn-disabled:hover {
    transform: none;
    box-shadow: none;
    background: #f8fafc;
    border-color: #e2e8f0;
  }

  .menu-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    font-size: 15px;
    flex-shrink: 0;
  }

  .icon-scan { background: #fee2e2; color: #dc2626; }
  .icon-panel { background: #dbeafe; color: #2563eb; }
  .icon-log { background: #fef3c7; color: #d97706; }

  .menu-info {
    flex: 1;
    overflow: hidden;
  }

  .menu-label {
    font-size: 13px;
    font-weight: 600;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .menu-desc {
    font-size: 11px;
    color: #64748b;
    margin-top: 1.5px;
  }

  .badge-count {
    font-size: 10.5px;
    font-weight: 700;
    background: #e2e8f0;
    color: #475569;
    padding: 1px 6px;
    border-radius: 8px;
  }

  .footer-hint {
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="head">
  <div class="brand">
    <span class="brand-dot"></span>
    <h3 class="title">Tepat</h3>
  </div>
  <div id="status" class="status-badge status-bad">Menyambung…</div>
</div>

<!-- 3大功能选项 -->
<div class="menu-list">
  <!-- 1. 全页扫描 (Imbas Seluruh Halaman) -->
  <button id="opt-scan-page" class="menu-btn" title="Imbas keseluruhan teks laman dan serlahkan kesalahan">
    <div class="menu-icon icon-scan">🔍</div>
    <div class="menu-info">
      <div class="menu-label">Imbas Seluruh Halaman</div>
      <div class="menu-desc">Sorot kesalahan pada teks halaman web</div>
    </div>
  </button>

  <!-- 2. 打开弹窗 (Buka Tetingkap Semakan) -->
  <button id="opt-open-panel" class="menu-btn" title="Papar tetingkap terapung semakan & PRPM">
    <div class="menu-icon icon-panel">💬</div>
    <div class="menu-info">
      <div class="menu-label">Tetingkap Semakan</div>
      <div class="menu-desc">Buka tetingkap carian kata & PRPM</div>
    </div>
  </button>

  <!-- 3. 导出日志 (Eksport Log JSON) -->
  <button id="opt-export-log" class="menu-btn" title="Muat turun fail JSON log kesalahan">
    <div class="menu-icon icon-log">📥</div>
    <div class="menu-info">
      <div class="menu-label">
        <span>Eksport Log Ralat</span>
        <span id="log-count" class="badge-count">0</span>
      </div>
      <div class="menu-desc">Muat turun laporan kesalahan (JSON)</div>
    </div>
  </button>
</div>

<div style="display:flex;justify-content:center;margin-bottom:8px;">
  <button id="opt-clear-hl" style="background:none;border:none;color:#64748b;font-size:11.5px;cursor:pointer;padding:4px 8px;text-decoration:underline;" title="Buang semua garisan warna pada halaman">Padam semua serlahan pada halaman</button>
</div>

<div class="footer-hint">
  Guna pintasan <b>Alt+S</b> untuk semak teks pilihan / buka tetingkap.
</div>

<script src="popup.js"></script>
</body>
</html>
