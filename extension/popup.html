<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    width: 300px;
    margin: 0;
    padding: 14px;
    color: #1e293b;
    background: #ffffff;
    user-select: none;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #3b82f6; box-shadow: 0 0 0 3px #dbeafe;
  }
  .title {
    margin: 0; font-size: 14.5px; font-weight: 700;
    color: #0f172a; letter-spacing: -0.2px;
  }
  .status-badge {
    font-size: 11px; font-weight: 600;
    padding: 2.5px 7px; border-radius: 10px;
  }
  .status-ok { background: #dcfce7; color: #15803d; }
  .status-bad { background: #fee2e2; color: #b91c1c; }

  .section-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
    color: #94a3b8; text-transform: uppercase;
    margin: 10px 0 6px;
  }

  .menu-list {
    display: flex; flex-direction: column; gap: 8px;
  }

  .menu-btn {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 12px;
    border: 1px solid #e2e8f0; background: #f8fafc;
    color: #1e293b; cursor: pointer; text-align: left;
    width: 100%;
    font: inherit;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .menu-btn:hover {
    background: #eff6ff; border-color: #bfdbfe;
    transform: translateY(-1.5px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }
  .menu-btn:active { transform: scale(0.98); }

  .menu-icon {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    font-size: 15px; flex-shrink: 0;
  }
  .icon-scan { background: #fee2e2; color: #dc2626; }
  .icon-panel { background: #dbeafe; color: #2563eb; }
  .icon-dash { background: #dcfce7; color: #16a34a; }
  .icon-clear { background: #f1f5f9; color: #64748b; }

  .menu-info { flex: 1; overflow: hidden; }
  .menu-label { font-size: 13px; font-weight: 600; color: #0f172a; }
  .menu-desc { font-size: 11px; color: #64748b; margin-top: 1.5px; }

  .footer-hint {
    padding-top: 10px; margin-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 11px; color: #94a3b8; line-height: 1.4;
  }
</style>
</head>
<body>

<div class="head">
  <div class="brand">
    <span class="brand-dot"></span>
    <h3 class="title">Tepat</h3>
  </div>
  <div id="status" class="status-badge status-bad">Connecting…</div>
</div>

<div class="section-label">On this page</div>
<div class="menu-list">
  <button id="opt-scan-page" class="menu-btn" title="Scan the full page text and highlight suspicious words">
    <div class="menu-icon icon-scan">🔍</div>
    <div class="menu-info">
      <div class="menu-label">Scan page</div>
      <div class="menu-desc">Highlight suspicious words on this page</div>
    </div>
  </button>

  <button id="opt-open-panel" class="menu-btn" title="Open the floating check & PRPM panel">
    <div class="menu-icon icon-panel">💬</div>
    <div class="menu-info">
      <div class="menu-label">Check panel</div>
      <div class="menu-desc">Floating word lookup & PRPM window</div>
    </div>
  </button>

  <button id="opt-clear-hl" class="menu-btn" title="Remove all highlights from this page">
    <div class="menu-icon icon-clear">🧹</div>
    <div class="menu-info">
      <div class="menu-label">Clear highlights</div>
      <div class="menu-desc">Remove all marks on this page</div>
    </div>
  </button>
</div>

<div class="section-label">Dashboard</div>
<div class="menu-list">
  <button id="opt-open-dashboard" class="menu-btn" title="Open the Tepat web dashboard (server frontend)">
    <div class="menu-icon icon-dash">⚙️</div>
    <div class="menu-info">
      <div class="menu-label">Open dashboard</div>
      <div class="menu-desc">Rules, proposals & settings (localhost:8377)</div>
    </div>
  </button>
</div>

<div class="footer-hint">
  <b>Alt+S</b> — check the selected text · <b>Alt+Shift+S</b> — quick check
</div>

<script src="popup.js"></script>
</body>
</html>
