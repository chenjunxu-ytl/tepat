<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    width: 300px;
    margin: 0;
    padding: 14px;
    color: #1e293b;
    background: #ffffff;
    user-select: none;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  /* server 状态就是 Tepat 左侧的点：绿 = 在跑，红 = 没跑（用户裁决 2026-10-08）*/
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ef4444; box-shadow: 0 0 0 3px #fee2e2;
    transition: all .25s ease;
  }
  .brand-dot.ok { background: #22c55e; box-shadow: 0 0 0 3px #dcfce7; }
  .title {
    margin: 0; font-size: 14.5px; font-weight: 700;
    color: #0f172a; letter-spacing: -0.2px;
  }
  .head-actions { display: flex; align-items: center; gap: 4px; }
  .head-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    border: none; background: transparent; cursor: pointer;
    color: #64748b; transition: all .15s ease;
  }
  .head-btn svg { width: 16px; height: 16px; }

  /* 每颗按钮一个语义色 + 非圆形 glyph（用户裁决 2026-10-14：环状/圆形
     glyph —— 旋转箭头、齿轮、脉冲光圈 —— 在 28px 里全糊成同一个圆圈）*/
  .btn-sync { color: #475569; }
  .btn-sync:hover { background: #e2e8f0; color: #1e293b; }
  .btn-flag { color: #b45309; }
  .btn-flag:hover { background: #fef3c7; color: #92400e; }
  .btn-restart { color: #047857; }
  .btn-restart:hover { background: #d1fae5; color: #065f46; }
  .btn-dash { color: #475569; }
  .btn-dash:hover { background: #e2e8f0; color: #1e293b; }

  /* update 按钮：不玩 icon+光圈（脉冲环在小按钮上就是"一个圆"）——
     直接蓝色药丸：白箭头 + Update 字样，加一圈柔和呼吸光晕引人点 */
  .update-btn {
    display: none; /* 默认隐藏——只有检测到新版才出现 */
    width: auto; height: 24px;
    padding: 0 10px 0 9px; gap: 5px;
    border-radius: 12px;
    background: #2563eb; color: #fff;
    font-size: 11px; font-weight: 700;
  }
  .update-btn.show { display: flex; animation: upd-glow 2s ease-in-out infinite; }
  .update-btn:hover { background: #1d4ed8; color: #fff; }
  .update-btn svg { width: 13px; height: 13px; }
  @keyframes upd-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .4); }
    50%      { box-shadow: 0 0 0 5px rgba(37, 99, 235, 0); }
  }

  /* sync 点击反馈：云朵里的箭头往下弹一下（云旋转没意义）*/
  .head-btn.syncing svg { animation: sync-bounce .7s ease; }
  @keyframes sync-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

  /* 主 CTA：打开浮动检查面板（唯一检查入口，2026-10-12） */
  .cta-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 14px;
    border: 1px solid #bfdbd1; border-radius: 12px;
    background: #eef5f3; color: #0f172a;
    cursor: pointer; text-align: left; font: inherit;
    transition: all .15s ease;
  }
  .cta-btn:hover { background: #e2efe9; border-color: #256b58; }
  .cta-btn:active { background: #d6e9e1; }
  .cta-ic {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: #256b58; color: #fff; flex-shrink: 0;
  }
  .cta-ic svg { width: 15px; height: 15px; }
  .cta-label { font-size: 13.5px; font-weight: 700; }
  .cta-desc { font-size: 11px; color: #526273; margin-top: 1px; }

</style>
</head>
<body>

<div class="head">
  <div class="brand">
    <span class="brand-dot" id="dot"></span>
    <h3 class="title">Tepat</h3>
  </div>
  <div class="head-actions">
    <button id="opt-update" class="head-btn update-btn" title="A new Tepat release is available">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Update
    </button>
    <button id="opt-sync" class="head-btn btn-sync" title="Fetch the latest rules & word lists from GitHub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m8.5 15.5 3.5 3.5 3.5-3.5"/></svg>
    </button>
    <button id="opt-flag" class="head-btn btn-flag" title="Report a subjective issue on this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>
    <button id="opt-restart" class="head-btn btn-restart" title="Restart the server (applies saved .env changes)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 2v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
    </button>
    <button id="opt-open-dashboard" class="head-btn btn-dash" title="Open the Tepat dashboard (server frontend)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
  </div>
</div>

<button id="opt-open-panel" class="cta-btn" title="Open the floating check panel — right-click any selection or type into it">
  <div class="cta-ic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div>
    <div class="cta-label">Open check panel</div>
    <div class="cta-desc">Right-click a selection or type to check</div>
  </div>
</button>

<script src="popup.js"></script>
</body>
</html>
