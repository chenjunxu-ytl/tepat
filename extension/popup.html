<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    width: 300px;
    margin: 0;
    padding: 14px;
    color: #1e293b;
    background: #ffffff;
    user-select: none;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  /* server 状态就是 Tepat 左侧的点：绿 = 在跑，红 = 没跑（用户裁决 2026-10-08）*/
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ef4444; box-shadow: 0 0 0 3px #fee2e2;
    transition: all .25s ease;
  }
  .brand-dot.ok { background: #22c55e; box-shadow: 0 0 0 3px #dcfce7; }
  .title {
    margin: 0; font-size: 14.5px; font-weight: 700;
    color: #0f172a; letter-spacing: -0.2px;
  }
  .head-actions { display: flex; align-items: center; gap: 4px; }
  .head-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    border: none; background: transparent; cursor: pointer;
    color: #64748b; transition: all .15s ease;
  }
  .head-btn:hover { background: #f1f5f9; color: #0f172a; }
  .head-btn svg { width: 15px; height: 15px; }

  /* update 按钮（用户裁决 2026-10-12）：启动时问 server 有没有新 release，
     有 → 显示在最左侧 + 脉冲动画吸引点击 → 点击打开 release 页 */
  .update-btn {
    display: none; /* 默认隐藏——只有检测到新版才出现 */
    position: relative;
    color: #2563eb;
    background: #dbeafe; /* 底色让按钮成块——黑色圆点观感的根因是透明底
                            只剩脉冲光圈；给个蓝色底块，箭头清晰浮在上面 */
  }
  .update-btn.show { display: flex; }
  .update-btn:hover { background: #bfdbfe; }
  .update-btn::after {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 10px;
    border: 2px solid #2563eb;  /* 脉冲改成描边扩散——实心光圈在小按钮上
                                    淹没 icon，看着就是一个黑/蓝圆 */
    animation: pulse 1.6s ease-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { transform: scale(.75); opacity: 1; }
    70%  { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  /* 主 CTA：打开浮动检查面板（唯一检查入口，2026-10-12） */
  .cta-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 14px;
    border: 1px solid #bfdbd1; border-radius: 12px;
    background: #eef5f3; color: #0f172a;
    cursor: pointer; text-align: left; font: inherit;
    transition: all .15s ease;
  }
  .cta-btn:hover { background: #e2efe9; border-color: #256b58; }
  .cta-btn:active { background: #d6e9e1; }
  .cta-ic {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: #256b58; color: #fff; flex-shrink: 0;
  }
  .cta-ic svg { width: 15px; height: 15px; }
  .cta-label { font-size: 13.5px; font-weight: 700; }
  .cta-desc { font-size: 11px; color: #526273; margin-top: 1px; }

</style>
</head>
<body>

<div class="head">
  <div class="brand">
    <span class="brand-dot" id="dot"></span>
    <h3 class="title">Tepat</h3>
  </div>
  <div class="head-actions">
    <button id="opt-update" class="head-btn update-btn" title="A new Tepat release is available">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
    <button id="opt-sync" class="head-btn" title="Fetch the latest rules & word lists from GitHub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
    <button id="opt-flag" class="head-btn" title="Report a subjective issue on this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>
    <button id="opt-restart" class="head-btn" title="Restart the server (applies saved .env changes)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button id="opt-open-dashboard" class="head-btn" title="Open the Tepat dashboard (server frontend)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>

<button id="opt-open-panel" class="cta-btn" title="Open the floating check panel — right-click any selection or type into it">
  <div class="cta-ic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div>
    <div class="cta-label">Open check panel</div>
    <div class="cta-desc">Right-click a selection or type to check</div>
  </div>
</button>

<script src="popup.js"></script>
</body>
</html>
